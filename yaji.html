<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SURVIVOR - LiveAi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #05050b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ゲームヘッダー */
    .game-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #090a14;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
    }
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }
    .game-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
    }

    /* ゲーム領域 */
    .game-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .canvas-box {
      width: 100%;
      max-width: 860px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      background: #030308;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    /* コントロールバー */
    .controls-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0.5rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .btn-restart {
      background: #00f3ff;
      color: #030308;
      border: none;
      padding: 0.65rem 1.6rem;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
      transition: all 0.2s;
    }
    .btn-restart:hover {
      background: #ffffff;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.9);
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .controls-bar {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="game-nav">
    <a href="index.html#game" class="back-link">← ゲーム一覧に戻る</a>
    <div class="game-title">NEON SURVIVOR</div>
    <div style="width: 100px;"></div>
  </nav>

  <!-- ゲーム画面 -->
  <div class="game-wrapper">
    <div class="canvas-box">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>
    <div class="controls-bar">
      <div>操作: マウス移動またはタッチスワイプで矢印を操作（オート射撃）</div>
      <button class="btn-restart" id="restartBtn">START / RETRY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let animationId;
    let isPlaying = false;
    let score = 0;

    const player = { x: 400, y: 225, radius: 10, angle: 0 };
    let enemies = [];
    let bullets = [];
    let particles = [];
    let targetPos = { x: 400, y: 225 };
    let lastSpawn = 0;
    let lastShot = 0;

    function initGame() {
      player.x = 400; player.y = 225;
      targetPos.x = 400; targetPos.y = 225;
      enemies = [];
      bullets = [];
      particles = [];
      score = 0;
      isPlaying = true;
      lastSpawn = Date.now();
      lastShot = Date.now();
    }

    // ネオン破片パーティクル
    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const speed = Math.random() * 4 + 1;
        const angle = Math.random() * Math.PI * 2;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: Math.random() * 0.03 + 0.02,
          color: color,
          size: Math.random() * 3 + 1.5
        });
      }
    }

    function gameLoop() {
      if (!isPlaying) return;

      // 自機の追従移動
      const dx = targetPos.x - player.x;
      const dy = targetPos.y - player.y;
      player.x += dx * 0.1;
      player.y += dy * 0.1;

      // 進行・目標方向を向く
      if (Math.hypot(dx, dy) > 2) {
        player.angle = Math.atan2(dy, dx);
      }

      // 自動射撃（ネオンビーム）
      if (Date.now() - lastShot > 180) {
        if (enemies.length > 0) {
          // 最も近い敵を狙う
          let nearest = enemies[0];
          let minDist = Math.hypot(nearest.x - player.x, nearest.y - player.y);
          for (let i = 1; i < enemies.length; i++) {
            const dist = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);
            if (dist < minDist) {
              minDist = dist;
              nearest = enemies[i];
            }
          }
          const shotAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(shotAngle) * 11,
            vy: Math.sin(shotAngle) * 11
          });
        }
        lastShot = Date.now();
      }

      // 敵の出現
      if (Date.now() - lastSpawn > 550) {
        const side = Math.floor(Math.random() * 4);
        let ex, ey;
        if (side === 0) { ex = Math.random() * 800; ey = -25; }
        else if (side === 1) { ex = 825; ey = Math.random() * 450; }
        else if (side === 2) { ex = Math.random() * 800; ey = 475; }
        else { ex = -25; ey = Math.random() * 450; }
        enemies.push({
          x: ex, y: ey,
          radius: 11,
          speed: Math.random() * 0.6 + 2.0,
          rotation: 0,
          rotSpeed: (Math.random() - 0.5) * 0.08
        });
        lastSpawn = Date.now();
      }

      // 弾の更新
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -10 || b.x > 810 || b.y < -10 || b.y > 460) {
          bullets.splice(i, 1);
        }
      }

      // 敵の更新 & 判定
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
        e.rotation += e.rotSpeed;

        // 自機衝突判定
        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
          createExplosion(player.x, player.y, "#00f3ff");
          gameOver();
          return;
        }

        // 弾衝突判定
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 6) {
            createExplosion(e.x, e.y, "#ff0055");
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 100;
            break;
          }
        }
      }

      // パーティクルの更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // --- 描画処理 ---
      // 背景（軌跡が残るクリア）
      ctx.fillStyle = "rgba(3, 3, 8, 0.35)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // パーティクル描画
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
      });

      // ネオン弾の描画
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#00f3ff";
      ctx.fillStyle = "#ffffff";
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      // ネオン敵（回転するピンクのひし形）の描画
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rotation);
        ctx.shadowBlur = 14;
        ctx.shadowColor = "#ff0055";
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 2.5;
        ctx.fillStyle = "rgba(255, 0, 85, 0.25)";
        ctx.beginPath();
        ctx.moveTo(0, -e.radius);
        ctx.lineTo(e.radius, 0);
        ctx.lineTo(0, e.radius);
        ctx.lineTo(-e.radius, 0);
        ctx.closePath();
        ctx.stroke();
        ctx.fill();
        ctx.restore();
      });

      // 自機（ネオン矢印 / 戦闘機）の描画
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      // エンジン噴射炎
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#ffaa00";
      ctx.fillStyle = "#ffaa00";
      ctx.beginPath();
      ctx.moveTo(-10, -4);
      ctx.lineTo(-18 - Math.random() * 5, 0);
      ctx.lineTo(-10, 4);
      ctx.closePath();
      ctx.fill();

      // 矢印型ボディ
      ctx.shadowBlur = 16;
      ctx.shadowColor = "#00f3ff";
      ctx.strokeStyle = "#00f3ff";
      ctx.lineWidth = 2.5;
      ctx.fillStyle = "#0c1524";
      ctx.beginPath();
      ctx.moveTo(18, 0);        // 先端
      ctx.lineTo(-12, -11);     // 左翼端
      ctx.lineTo(-6, 0);        // くびれ
      ctx.lineTo(-12, 11);      // 右翼端
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // コックピットコア
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // スコア表示
      ctx.save();
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#00f3ff";
      ctx.fillStyle = "#00f3ff";
      ctx.font = "bold 18px 'Courier New', monospace";
      ctx.fillText(`SCORE: ${score.toString().padStart(6, '0')}`, 24, 34);
      ctx.restore();

      animationId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isPlaying = false;
      cancelAnimationFrame(animationId);

      // パーティクルの最終描画
      ctx.fillStyle = "rgba(3, 3, 8, 0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.textAlign = "center";
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ff0055";
      ctx.fillStyle = "#ff0055";
      ctx.font = "900 32px sans-serif";
      ctx.fillText("SYSTEM TERMINATED", 400, 210);

      ctx.shadowBlur = 10;
      ctx.shadowColor = "#00f3ff";
      ctx.fillStyle = "#00f3ff";
      ctx.font = "bold 18px 'Courier New', monospace";
      ctx.fillText(`FINAL SCORE: ${score}`, 400, 250);
      ctx.restore();
    }

    function updatePos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      targetPos.x = (clientX - rect.left) * scaleX;
      targetPos.y = (clientY - rect.top) * scaleY;
    }

    canvas.addEventListener("mousemove", updatePos);
    canvas.addEventListener("touchmove", (e) => { updatePos(e); e.preventDefault(); }, { passive: false });

    document.getElementById("restartBtn").addEventListener("click", () => {
      cancelAnimationFrame(animationId);
      initGame();
      gameLoop();
    });

    // 初期起動画面
    ctx.fillStyle = "#030308";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.textAlign = "center";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00f3ff";
    ctx.fillStyle = "#00f3ff";
    ctx.font = "900 28px sans-serif";
    ctx.fillText("NEON SURVIVOR", 400, 205);
    ctx.shadowBlur = 5;
    ctx.fillStyle = "#94a3b8";
    ctx.font = "14px sans-serif";
    ctx.fillText("PRESS [START] TO LAUNCH", 400, 245);
    ctx.restore();
  </script>
</body>
</html>
