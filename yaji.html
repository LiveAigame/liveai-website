<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SURVIVOR - LiveAi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #05050b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ゲームヘッダー */
    .game-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #090a14;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
    }
    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }
    .game-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
    }

    /* ゲーム領域 */
    .game-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .canvas-box {
      width: 100%;
      max-width: 860px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      background: #030308;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    /* コントロールバー */
    .controls-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0.5rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
