<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINIMAL SURVIVOR - LiveAi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ゲーム画面ヘッダー */
    .game-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }
    .back-link {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #ffffff;
    }
    .game-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ゲーム表示領域 */
    .game-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .canvas-box {
      width: 100%;
      max-width: 860px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid #1f2937;
      background: #0f172a;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    /* コントロールバー */
    .controls-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0.5rem;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .btn-restart {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-restart:hover {
      background-color: #2563eb;
    }

    @media (max-width: 600px) {
      .controls-bar {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー（戻るボタン） -->
  <nav class="game-nav">
    <a href="index.html#game" class="back-link">← ゲーム一覧に戻る</a>
    <div class="game-title">MINIMAL SURVIVOR</div>
    <div style="width: 100px;"></div>
  </nav>

  <!-- ゲーム本体 -->
  <div class="game-wrapper">
    <div class="canvas-box">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>
    <div class="controls-bar">
      <div>操作: マウス移動または画面スワイプで矢印を操作</div>
      <button class="btn-restart" id="restartBtn">スタート / やり直す</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let animationId;
    let isPlaying = false;
    let score = 0;

    const player = { x: 400, y: 225, radius: 10 };
    let enemies = [];
    let bullets = [];
    let targetPos = { x: 400, y: 225 };
    let lastSpawn = 0;
    let lastShot = 0;

    function initGame() {
      player.x = 400; player.y = 225;
      targetPos.x = 400; targetPos.y = 225;
      enemies = [];
      bullets = [];
      score = 0;
      isPlaying = true;
      lastSpawn = Date.now();
      lastShot = Date.now();
    }

    function gameLoop() {
      if (!isPlaying) return;

      // プレイヤーの移動
      const dx = targetPos.x - player.x;
      const dy = targetPos.y - player.y;
      player.x += dx * 0.1;
      player.y += dy * 0.1;

      // 自動射撃
      if (Date.now() - lastShot > 220) {
        if (enemies.length > 0) {
          const target = enemies[0];
          const angle = Math.atan2(target.y - player.y, target.x - player.x);
          bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10 });
        }
        lastShot = Date.now();
      }

      // 敵の出現
      if (Date.now() - lastSpawn > 600) {
        const side = Math.floor(Math.random() * 4);
        let ex, ey;
        if (side === 0) { ex = Math.random() * 800; ey = -20; }
        else if (side === 1) { ex = 820; ey = Math.random() * 450; }
        else if (side === 2) { ex = Math.random() * 800; ey = 470; }
        else { ex = -20; ey = Math.random() * 450; }
        enemies.push({ x: ex, y: ey, radius: 10, speed: 2.2 });
        lastSpawn = Date.now();
      }

      // 弾の更新
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0 || b.x > 800 || b.y < 0 || b.y > 450) bullets.splice(i, 1);
      }

      // 敵の更新 & 衝突判定
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // 自機との接触判定
        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
          gameOver();
          return;
        }

        // 弾との接触判定
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 10;
            break;
          }
        }
      }

      // --- 描画処理 ---
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 弾の描画
      ctx.fillStyle = "#38bdf8";
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 自機（矢印 / 戦闘機シェイプ）の描画
      const aimAngle = Math.atan2(targetPos.y - player.y, targetPos.x - player.x);
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(aimAngle);

      ctx.fillStyle = "#38bdf8"; // 噴射光
      ctx.beginPath();
      ctx.moveTo(-10, -4);
      ctx.lineTo(-16, 0);
      ctx.lineTo(-10, 4);
      ctx.fill();

      ctx.fillStyle = "#ffffff"; // 矢印型の機体
      ctx.beginPath();
      ctx.moveTo(16, 0);       // 先端
      ctx.lineTo(-10, -10);    // 左翼
      ctx.lineTo(-5, 0);       // くびれ
      ctx.lineTo(-10, 10);     // 右翼
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 敵の描画
      ctx.fillStyle = "#f43f5e";
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // スコア表示
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(`SCORE: ${score}`, 24, 32);

      animationId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isPlaying = false;
      cancelAnimationFrame(animationId);
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", 400, 215);
      ctx.font = "16px sans-serif";
      ctx.fillStyle = "#94a3b8";
      ctx.fillText(`SCORE: ${score}`, 400, 250);
      ctx.textAlign = "start";
    }

    function updatePos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      targetPos.x = (clientX - rect.left) * scaleX;
      targetPos.y = (clientY - rect.top) * scaleY;
    }

    canvas.addEventListener("mousemove", updatePos);
    canvas.addEventListener("touchmove", (e) => { updatePos(e); e.preventDefault(); }, { passive: false });

    document.getElementById("restartBtn").addEventListener("click", () => {
      cancelAnimationFrame(animationId);
      initGame();
      gameLoop();
    });

    // 初期待機画面
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("「スタート」ボタンを押して開始", 400, 225);
    ctx.textAlign = "start";
  </script>
</body>
</html>
